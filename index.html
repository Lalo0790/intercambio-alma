<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Intercambio navideño</title>
<meta property="og:title" content="Intercambio navideño">
<meta property="og:description" content="Abre tu link para ver a quién le regalas.">
<meta name="theme-color" content="#24392f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#2a2420;--soft:#6f645b;--line:#e4d9c9;--paper:#f7f1e7;--card:#fffdf9;--pine:#24392f;--berry:#9b2f2a;--gold:#b48a3c;--ok:#3d6b4f}
html{-webkit-text-size-adjust:100%}
body{font-family:Figtree,system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.45}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(#d9ccb6 .6px,transparent .6px);background-size:7px 7px;z-index:-1}
.top{background:var(--pine);color:#f4ead8;padding:28px 22px 46px;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,var(--berry) 0 14px,#f4ead8 14px 18px,var(--pine) 18px 32px,#f4ead8 32px 36px);opacity:.9}
.top .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.top h1{font-family:Fraunces,serif;font-weight:600;font-size:30px;line-height:1.1;margin-top:6px;max-width:440px}
.top p{font-size:14px;opacity:.8;margin-top:8px;max-width:420px}
.sprig{position:absolute;right:-10px;top:10px;width:120px;opacity:.22}
main{max-width:520px;margin:-22px auto 0;padding:0 14px 30px;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-bottom:14px;box-shadow:0 1px 0 #fff inset,0 6px 18px -12px #5a43284d}
.card h2{font-family:Fraunces,serif;font-weight:600;font-size:20px;margin-bottom:4px}
.card .sub{color:var(--soft);font-size:13.5px;margin-bottom:12px}
.step{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--berry);margin-bottom:4px}
label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:12px 0 5px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #d9cdbb;border-radius:10px;padding:12px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid #b48a3c55;border-color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:14px 16px;font:600 15px Figtree,sans-serif;cursor:pointer;text-decoration:none;width:100%;margin-top:12px}
.btn.main{background:var(--berry);color:#fff}
.btn.main:active{transform:translateY(1px)}
.btn.quiet{background:transparent;border:1px solid #d9cdbb;color:var(--ink)}
.btn.pine{background:var(--pine);color:#f4ead8}
.btn[disabled]{opacity:.5}
.status{font-size:12.5px;color:var(--soft);text-align:right;min-height:18px;margin-top:6px}
.person{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #efe6d8}
.person:last-child{border-bottom:0}
.num{width:24px;font-size:12px;color:#a8998a;text-align:right;flex:none}
.person input{border:0;border-bottom:1px dashed transparent;border-radius:0;padding:6px 2px;background:transparent}
.person input:focus{outline:0;border-bottom-color:var(--gold)}
.del{background:none;border:0;color:#b09f8f;font-size:20px;width:34px;height:34px;cursor:pointer;flex:none;border-radius:8px}
.del:hover{background:#f3ebe0;color:var(--berry)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.addrow .btn{width:auto;margin:0;padding:0 18px}
.link{font-size:13.5px;color:var(--pine);text-decoration:underline;background:none;border:0;cursor:pointer;font-family:inherit;margin-top:10px}
.empty{color:var(--soft);font-size:14px;padding:14px;border:1px dashed #d9cdbb;border-radius:10px;text-align:center}
.count{display:inline-block;background:#efe5d4;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:600;color:var(--soft);margin-left:6px;vertical-align:middle;font-family:Figtree}
.row{padding:12px 0;border-bottom:1px solid #efe6d8}
.row:last-child{border-bottom:0}
.row .nm{font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:#f1eadf;color:var(--soft)}
.tag.on{background:#e3eee6;color:var(--ok)}
.acts{display:flex;gap:8px}
.acts .btn{margin:0;padding:10px 12px;font-size:14px}
.wa{background:#1f7a4d;color:#fff}
.excl{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:7px 0;border-bottom:1px solid #efe6d8}
.pairs div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #efe6d8;font-size:14.5px}
.note{font-size:13px;color:var(--soft);background:#f6efe2;border-radius:10px;padding:10px 12px;margin-top:10px}
.foot{text-align:center;font-size:11.5px;color:#a3958a;padding:8px 0 26px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.edit{border:1px solid #d9cdbb;background:#fff;border-radius:10px;padding:9px 16px;font:600 14px Figtree,sans-serif;color:var(--pine);cursor:pointer;flex:none}
.btn.big{padding:17px;font-size:16.5px;margin-top:18px}
.locked{opacity:.55}
.more{cursor:pointer;font-size:14px;color:var(--pine);margin-top:14px;padding:4px 0}
.names{font-size:15px;line-height:1.6}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.acts .btn.wa{flex:2}.acts .btn.quiet{flex:1}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:10px;text-align:left}
.glw{display:flex;align-items:center;gap:4px}
.gl{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-decoration:none;color:var(--ink)}
.gl:active{background:#faf5ec}
.gi{width:40px;height:40px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font:700 14px Figtree,sans-serif}
.gt{flex:1;min-width:0;display:flex;flex-direction:column}
.gt b{font-size:13px;color:var(--soft);font-weight:600}
.gt span{font-size:14.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.gt small{font-size:12.5px;color:var(--soft)}
.ga{color:var(--gold);font-size:18px;flex:none}
.lnkhead{font-weight:600;font-size:14.5px;margin-top:16px}
/* participante */
.envelope{margin:6px auto 4px;width:220px;height:150px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.envelope .body{position:absolute;inset:0;background:#f0e2c8;border-radius:8px;border:1px solid #dcc8a5}
.envelope .flap{position:absolute;left:0;right:0;top:0;height:90px;background:#e8d5b2;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:8px 8px 0 0;transform-origin:top;transition:transform .6s}
.envelope .seal{position:absolute;left:50%;top:68px;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--berry);color:#f4ead8;font-family:Fraunces,serif;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #6e1f1b;transition:opacity .3s}
.envelope.open .flap{transform:rotateX(180deg)}
.envelope.open .seal{opacity:0}
.reveal{text-align:center}
.reveal .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.reveal .who{font-family:Fraunces,serif;font-size:34px;font-weight:600;color:var(--berry);line-height:1.15;margin:6px 0 2px}
.wishbox{background:#fbf6ec;border-left:3px solid var(--gold);padding:12px 14px;border-radius:6px;white-space:pre-wrap;text-align:left;font-size:14.5px;margin-top:12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.facts dt{color:var(--soft)}
.facts dd{font-weight:600}
.msg{white-space:pre-wrap;font-size:14.5px}
@media (min-width:600px){.top{padding:36px 24px 52px}.top h1{font-size:36px}}
</style>
</head>
<body>
<header class="top">
  <svg class="sprig" viewBox="0 0 100 100" fill="none" stroke="#f4ead8" stroke-width="2"><path d="M50 95V10M50 30l-18-12M50 30l18-12M50 50l-24-14M50 50l24-14M50 70l-28-14M50 70l28-14"/><circle cx="30" cy="80" r="5" fill="#f4ead8"/><circle cx="40" cy="86" r="4" fill="#f4ead8"/></svg>
  <div class="kicker" id="kicker">Intercambio de regalos</div>
  <h1 id="title">Intercambio navideño</h1>
  <p id="subtitle"></p>
</header>
<main id="app">
  <div class="card"><p class="sub" style="margin:0">Cargando…</p></div>
</main>
<p class="foot">Hecho por Eduardo García Soluciones</p>
<div class="toast" id="toast"></div>

<script>
const API='https://ustkwaeyanwhdoirrpld.supabase.co/rest/v1/rpc/';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzdGt3YWV5YW53aGRvaXJycGxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzNTk0OTcsImV4cCI6MjEwOTkzNTQ5N30.FJS_Sv-CnZc1jwTKP1v6FSQhr7IqIT4tynFz9aMRwQk';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
async function rpc(fn,args){
  const r=await fetch(API+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);
  if(!r.ok){const m=(j&&j.message)||'error';throw new Error(m)}
  return j;
}
function fecha(d){if(!d)return'';try{const s=new Date(d+'T12:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1)}catch(e){return d}}
const hash=new URLSearchParams(location.hash.slice(1));
const ADMIN=hash.get('a'), PTOK=hash.get('p');
const BASE=location.origin+location.pathname;

if(ADMIN) adminInit(); else if(PTOK) partInit(); else noLink();

function noLink(){
  $('#subtitle').textContent='';
  $('#app').innerHTML=`<div class="card"><h2>Necesitas tu link personal</h2><p class="sub" style="margin-top:6px">Cada participante recibe un link propio por WhatsApp. Pídeselo a quien organiza el intercambio.</p></div>`;
}

/* ================= ORGANIZADORA ================= */
let S=null, saveTimer=null, pollT=null;
const E={s1:false,s2:false};
async function adminInit(){
  $('#kicker').textContent='Tu panel para organizar';
  try{S=await rpc('ix_admin_get',{tok:ADMIN})}catch(e){
    $('#app').innerHTML=`<div class="card"><h2>Este link no funciona</h2><p class="sub" style="margin-top:6px">Revisa que lo hayas copiado completo.</p></div>`;return}
  E.s1=!s1Done();
  E.s2=s1Done()&&!S.group.drawn_at&&(S.people.length<3||!localStorage.getItem('ix_s2_'+ADMIN.slice(0,6)));
  renderAdmin();
}
const s1Done=()=>!!(S.group.event_date&&S.group.budget);
const drawn=()=>!!S.group.drawn_at;
const val=(id,k)=>{const e=$('#'+id);return e?e.value:(S.group[k]??'')};
function settingsFromForm(){
  return{name:val('gName','name'),event_date:val('gDate','event_date'),event_time:val('gTime','event_time'),place:val('gPlace','place'),budget:val('gBudget','budget'),message:val('gMsg','message'),exclusions:S.group.exclusions||[]};
}
const peopleList=()=>S.people.map(p=>({id:p.id,name:p.name}));
async function save(people){
  const st=$('#saveSt');if(st)st.textContent='Guardando…';
  try{
    S=await rpc('ix_admin_save',{tok:ADMIN,settings:settingsFromForm(),people:people||peopleList()});
    if($('#saveSt'))$('#saveSt').textContent='Guardado';
    renderHead();renderS2();renderS3();return true;
  }catch(e){toast('No se pudo guardar. Revisa tu internet e inténtalo otra vez.');if($('#saveSt'))$('#saveSt').textContent='Sin guardar';return false}
}
function confirmBreak(){return !drawn()||confirm('Ya hiciste el sorteo. Si cambias los nombres, hay que sortear otra vez.\n\nCada persona conserva su mismo link; solo avísales que se volvió a sortear. ¿Seguir?')}
function renderHead(){
  $('#title').textContent=S.group.name||'Intercambio navideño';
  const bits=[fecha(S.group.event_date),S.group.budget].filter(Boolean);
  $('#subtitle').textContent=bits.join(' · ')||'Son 3 pasos: datos, nombres y sorteo.';
}
function renderAdmin(){
  renderHead();
  $('#app').innerHTML=`<section class="card" id="s1"></section><section class="card" id="s2"></section><section class="card" id="s3"></section>`;
  renderS1();renderS2();renderS3();
}
function head(n,t,done,editId){
  return `<div class="shead"><div><div class="step">${done?'✓ ':''}Paso ${n}</div><h2>${t}</h2></div>${editId?`<button class="edit" id="${editId}">Editar</button>`:''}</div>`;
}
function renderS1(){
  const g=S.group,c=$('#s1');
  if(!E.s1){
    const rows=[['Nombre',g.name],['Fecha',fecha(g.event_date)],['Hora',g.event_time],['Lugar',g.place],['Monto',g.budget]].filter(x=>x[1]);
    c.innerHTML=head(1,'Datos del intercambio',true,'e1')+`<dl class="facts">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>${g.message?`<p class="msg" style="margin-top:10px;color:var(--soft)">${esc(g.message)}</p>`:''}`;
    $('#e1').onclick=()=>{E.s1=true;renderS1();$('#gName').focus()};return;
  }
  const extra=g.event_time||g.place||g.message;
  c.innerHTML=head(1,'Datos del intercambio',false)+`
    <label for="gName">Nombre del intercambio</label><input id="gName" value="${esc(g.name)}" maxlength="80">
    <label for="gDate">¿Qué día es?</label><input id="gDate" type="date" value="${esc(g.event_date||'')}">
    <label for="gBudget">¿De cuánto es el regalo?</label><input id="gBudget" value="${esc(g.budget)}" placeholder="Ej. $300" maxlength="60" inputmode="text">
    <details ${extra?'open':''}><summary class="more">Agregar hora, lugar o un mensaje (si quieres)</summary>
      <label for="gTime">Hora</label><input id="gTime" value="${esc(g.event_time)}" placeholder="Ej. 6:00 pm" maxlength="40">
      <label for="gPlace">Lugar</label><input id="gPlace" value="${esc(g.place)}" placeholder="Ej. Casa de Paty" maxlength="150">
      <label for="gMsg">Mensaje para el grupo</label><textarea id="gMsg" placeholder="Ej. Traer el regalo envuelto y con nombre.">${esc(g.message)}</textarea>
    </details>
    <button class="btn main big" id="ok1">Guardar y seguir</button>
    <div class="status" id="saveSt"></div>`;
  ['gName','gDate','gTime','gPlace','gBudget','gMsg'].forEach(id=>$('#'+id).addEventListener('input',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(),800)}));
  $('#ok1').onclick=async()=>{
    if(!$('#gDate').value)return toast('Falta poner la fecha'),$('#gDate').focus();
    if(!$('#gBudget').value.trim())return toast('Falta poner el monto del regalo'),$('#gBudget').focus();
    clearTimeout(saveTimer);
    if(await save()){E.s1=false;if(!drawn())E.s2=true;renderS1();renderS2();renderS3();$('#s2').scrollIntoView({behavior:'smooth'})}
  };
}
function renderS2(){
  const c=$('#s2');
  if(!s1Done()&&!S.people.length&&E.s1){c.innerHTML=head(2,'¿Quiénes participan?',false)+`<p class="sub">Primero llena el paso 1.</p>`;c.classList.add('locked');return}
  c.classList.remove('locked');
  if(!E.s2){
    c.innerHTML=head(2,`¿Quiénes participan? <span class="count">${S.people.length}</span>`,S.people.length>=3,'e2')+
      (S.people.length?`<p class="names">${S.people.map(p=>esc(p.name)).join(', ')}</p>`:`<p class="sub">Todavía no hay nombres.</p>`);
    $('#e2').onclick=()=>{E.s2=true;renderS2();renderS3();$('#newName')&&$('#newName').focus()};return;
  }
  c.innerHTML=head(2,`¿Quiénes participan? <span class="count">${S.people.length}</span>`,false)+`
    <p class="sub">Escribe un nombre y toca Agregar. Si ya tienes la lista, pégala completa.</p>
    <div class="addrow"><input id="newName" placeholder="Nombre" maxlength="60" enterkeyhint="done"><button class="btn pine" id="addBtn">Agregar</button></div>
    <button class="link" id="bulkToggle">Pegar la lista completa</button>
    <div id="bulk" class="hide">
      <textarea id="bulkTxt" placeholder="Un nombre por renglón&#10;Paty&#10;Gaby&#10;Lucía"></textarea>
      <button class="btn quiet" id="bulkAdd">Agregar todos</button>
    </div>
    <div id="people" style="margin-top:12px"></div>
    <button class="btn main big" id="ok2" ${S.people.length<3?'disabled':''}>Listo, ya están todos</button>
    ${S.people.length<3?'<p class="sub" style="text-align:center;margin-top:8px">Se necesitan al menos 3 personas.</p>':''}`;
  $('#people').innerHTML=S.people.map((p,i)=>`<div class="person"><span class="num">${i+1}</span><input value="${esc(p.name)}" data-id="${p.id}" maxlength="60" aria-label="Nombre"><button class="del" data-id="${p.id}" aria-label="Quitar">×</button></div>`).join('');
  $('#addBtn').onclick=addOne;
  $('#newName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addOne()}});
  $('#bulkToggle').onclick=()=>{$('#bulk').classList.toggle('hide');$('#bulkTxt').focus()};
  $('#bulkAdd').onclick=async()=>{
    const names=$('#bulkTxt').value.split(/\n|,/).map(s=>s.trim()).filter(Boolean);
    if(!names.length)return toast('Escribe al menos un nombre');
    if(!confirmBreak())return;
    const have=new Set(S.people.map(p=>p.name.toLowerCase()));
    const fresh=names.filter(n=>{const k=n.toLowerCase();if(have.has(k))return false;have.add(k);return true});
    if(await save([...peopleList(),...fresh.map(name=>({name}))]))toast(fresh.length===1?'Se agregó 1 nombre':'Se agregaron '+fresh.length+' nombres');
  };
  document.querySelectorAll('.person input').forEach(inp=>inp.addEventListener('change',()=>{
    const v=inp.value.trim();const p=S.people.find(x=>x.id===inp.dataset.id);
    if(!v){inp.value=p.name;return}p.name=v;save();
  }));
  document.querySelectorAll('.person .del').forEach(b=>b.onclick=()=>{
    const p=S.people.find(x=>x.id===b.dataset.id);
    if(!confirm('¿Quitar a '+p.name+'?'))return;
    if(!confirmBreak())return;
    S.group.exclusions=(S.group.exclusions||[]).filter(e=>!e.includes(p.id));
    save(peopleList().filter(x=>x.id!==p.id));
  });
  $('#ok2').onclick=()=>{localStorage.setItem('ix_s2_'+ADMIN.slice(0,6),'1');E.s2=false;renderS2();renderS3();$('#s3').scrollIntoView({behavior:'smooth'})};
}
async function addOne(){
  const n=$('#newName').value.trim();
  if(!n)return toast('Escribe un nombre');
  if(S.people.some(p=>p.name.toLowerCase()===n.toLowerCase()))return toast('Ese nombre ya está');
  if(!confirmBreak())return;
  $('#newName').value='';
  await save([...peopleList(),{name:n}]);$('#newName')&&$('#newName').focus();
}
function renderS3(){
  const c=$('#s3');clearInterval(pollT);
  const ready=s1Done()&&S.people.length>=3&&!E.s2;
  if(!drawn()){
    c.innerHTML=head(3,'Sortear y mandar links',false)+(ready?
      `<p class="sub">Toca el botón y el sistema sortea solo. A nadie le sale su propio nombre y nadie, ni tú, ve quién le tocó a quién.</p>
       <button class="btn main big" id="drawBtn">Hacer el sorteo</button>${moreOpts()}`
      :`<p class="sub">${!s1Done()?'Primero llena el paso 1.':'Agrega los nombres y toca "Listo, ya están todos".'}</p>`);
    c.classList.toggle('locked',!ready);
    if(ready){$('#drawBtn').onclick=doDraw;bindMore()}
    return;
  }
  c.classList.remove('locked');
  const opened=S.people.filter(p=>p.opened).length;
  c.innerHTML=head(3,'Manda a cada quien su link',true)+`
    <p class="sub">El sorteo ya está hecho. Toca <b>WhatsApp</b> junto a cada nombre y elige a esa persona. En su link verá a quién le regala y podrá escribir su lista de deseos.</p>
    <div class="tags"><span class="tag on">${opened} de ${S.people.length} ya abrieron su link</span></div>
    <div id="links">${S.people.map(p=>`<div class="row"><div class="rtop"><span class="nm">${esc(p.name)}</span><span class="tag ${p.opened?'on':''}">${p.opened?'Ya lo vio':'Aún no lo abre'}</span></div>
      <div class="acts"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(waText(p))}">WhatsApp</a><button class="btn quiet" data-copy="${p.id}">Copiar</button></div></div>`).join('')}</div>
    ${moreOpts(true)}`;
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const p=S.people.find(x=>x.id===b.dataset.copy);copy(waText(p),b)});
  bindMore();
  pollT=setInterval(refresh,30000);
}
function moreOpts(after){
  return `<details class="moreopts"><summary class="more">Más opciones</summary>
    <div class="note" style="margin-top:10px"><b>Personas que no deben tocarse</b><br>Por ejemplo, hermanas o esposos.</div>
    <div id="exList"></div>
    <div class="two" style="margin-top:8px"><select id="exA"></select><select id="exB"></select></div>
    <button class="btn quiet" id="exAdd">Agregar</button>
    ${after?`<button class="btn quiet" id="redraw">Volver a sortear</button>
    <button class="btn quiet" id="reveal">Ver quién le toca a quién</button><div id="pairs" class="pairs"></div>`:''}
  </details>`;
}
function bindMore(){
  const name=id=>(S.people.find(p=>p.id===id)||{}).name;
  const ex=(S.group.exclusions||[]).filter(e=>name(e[0])&&name(e[1]));
  $('#exList').innerHTML=ex.map((e,i)=>`<div class="excl"><span>${esc(name(e[0]))} y ${esc(name(e[1]))}</span><button class="del" data-ex="${i}" aria-label="Quitar">×</button></div>`).join('');
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{if(!confirmBreak())return;S.group.exclusions=ex.filter((_,i)=>i!=b.dataset.ex);save().then(keepOpen)});
  const opts='<option value="">Elige…</option>'+S.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  $('#exA').innerHTML=opts;$('#exB').innerHTML=opts;
  $('#exAdd').onclick=()=>{
    const a=$('#exA').value,b=$('#exB').value;
    if(!a||!b||a===b)return toast('Elige dos personas distintas');
    if(!confirmBreak())return;
    S.group.exclusions=[...ex,[a,b]];save().then(keepOpen);
  };
  if($('#redraw'))$('#redraw').onclick=()=>{if(confirm('¿Sortear otra vez? Cada persona conserva su mismo link, pero avísales que cambió.'))doDraw()};
  if($('#reveal'))$('#reveal').onclick=reveal;
}
const keepOpen=()=>{const d=$('.moreopts');if(d)d.open=true};
function waText(p){
  return `¡Hola ${p.name}! Ya quedó el sorteo de "${S.group.name}". En este link ves a quién le regalas y puedes dejar tu lista de deseos. Es solo tuyo, no lo compartas:\n${BASE}#p=${p.token}`;
}
async function copy(t,b){
  try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  if(b){const o=b.textContent;b.textContent='Copiado';setTimeout(()=>b.textContent=o,1500)}
}
async function refresh(){if(document.querySelector('.moreopts[open]'))return;try{S=await rpc('ix_admin_get',{tok:ADMIN});renderS3()}catch(e){}}
async function doDraw(){
  const b=$('#drawBtn')||$('#redraw');if(b){b.disabled=true;b.textContent='Sorteando…'}
  try{S=await rpc('ix_admin_draw',{tok:ADMIN});E.s2=false;renderS2();renderS3();toast('¡Listo! Ya quedó el sorteo');$('#s3').scrollIntoView({behavior:'smooth'})}
  catch(e){toast(e.message==='sin_solucion'?'Con esas personas que no deben tocarse no se puede sortear. Quita alguna.':'No se pudo sortear, inténtalo otra vez.');renderS3()}
}
async function reveal(){
  if($('#pairs').innerHTML){$('#pairs').innerHTML='';return}
  if(!confirm('Esto te muestra a quién le tocó cada persona y ya no será secreto para ti. ¿Seguro?'))return;
  try{const r=await rpc('ix_admin_reveal',{tok:ADMIN});$('#pairs').innerHTML=r.map(x=>`<div><span>${esc(x.from)}</span><span>→ ${esc(x.to)}</span></div>`).join('')}catch(e){toast('No se pudo cargar')}
}

/* ===== links de regalos ===== */
const STORES=[
 [/(^|\.)(amazon\.[a-z.]+|amzn\.to|a\.co|amzn\.eu)$/,'Amazon','#232f3e','#ff9900','a'],
 [/(^|\.)(mercadolibre\.[a-z.]+|mercadolivre\.[a-z.]+|meli\.la)$/,'Mercado Libre','#ffe600','#2d3277','ML'],
 [/(^|\.)liverpool\.com\.mx$/,'Liverpool','#e10098','#fff','L'],
 [/(^|\.)(walmart\.com\.mx|walmart\.com)$/,'Walmart','#0071dc','#ffc220','W'],
 [/(^|\.)elpalaciodehierro\.com$/,'El Palacio de Hierro','#111','#fff','PH'],
 [/(^|\.)coppel\.com$/,'Coppel','#ffd400','#0a3d8f','C'],
 [/(^|\.)sanborns\.com\.mx$/,'Sanborns','#7a1f2b','#fff','S'],
 [/(^|\.)(shein\.[a-z.]+|shein\.top)$/,'Shein','#111','#fff','S'],
 [/(^|\.)temu\.com$/,'Temu','#fb7701','#fff','T'],
 [/(^|\.)sears\.com\.mx$/,'Sears','#00539f','#fff','S'],
 [/(^|\.)suburbia\.com\.mx$/,'Suburbia','#6b1e78','#fff','S'],
 [/(^|\.)costco\.com\.mx$/,'Costco','#e31837','#fff','C'],
 [/(^|\.)etsy\.com$/,'Etsy','#f1641e','#fff','E'],
];
function findUrl(t){const m=String(t||'').match(/https?:\/\/[^\s<>"']+/i);return m?m[0].replace(/[).,;]+$/,''):null}
function storeOf(u){
  let h='';try{h=new URL(u).hostname.replace(/^www\./,'').toLowerCase()}catch(e){}
  for(const s of STORES)if(s[0].test(h))return{name:s[1],bg:s[2],fg:s[3],ini:s[4]};
  const base=h.split('.').filter(x=>!['com','mx','net','org','shop','store','co'].includes(x));
  const n=(base[base.length-1]||h||'Tienda');return{name:n.charAt(0).toUpperCase()+n.slice(1),bg:'#e9e0d1',fg:'#4a3f36',ini:n.charAt(0).toUpperCase()};
}
function titleOf(u){
  try{
    const x=new URL(u);let segs=x.pathname.split('/').map(s=>{try{return decodeURIComponent(s)}catch(e){return s}});
    let best='';
    const i=segs.indexOf('dp');if(i>0&&segs[i-1])best=segs[i-1];
    if(!best)for(const s of segs){const c=s.replace(/^ML[A-Z]-?\d+-?/,'').replace(/-_JM$|_JM$/,'');if(/[a-záéíóúñ]{3,}.*-.*[a-záéíóúñ]{3,}/i.test(c)&&c.length>best.length)best=c}
    best=best.replace(/[-_+]+/g,' ').replace(/\s+/g,' ').trim();
    if(best.length<6)return '';
    best=best.charAt(0).toUpperCase()+best.slice(1);
    return best.length>70?best.slice(0,68)+'…':best;
  }catch(e){return ''}
}
function shortUrl(u){try{const x=new URL(u);let s=x.hostname.replace(/^www\./,'')+x.pathname;return s.length>38?s.slice(0,36)+'…':s}catch(e){return u}}
function linkCard(l,i,editable){
  const s=storeOf(l.url),t=titleOf(l.url);
  return `<div class="glw"><a class="gl" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
    <span class="gi" style="background:${s.bg};color:${s.fg}">${esc(s.ini)}</span>
    <span class="gt"><b>${esc(s.name)}</b><span>${esc(t||shortUrl(l.url))}</span>${l.note?`<small>${esc(l.note)}</small>`:''}</span>
    <span class="ga" aria-hidden="true">↗</span></a>${editable?`<button class="del gdel" data-li="${i}" aria-label="Quitar link">×</button>`:''}</div>`;
}

/* ================= PARTICIPANTE ================= */
async function partInit(){
  let d;
  try{d=await rpc('ix_me',{ptok:PTOK})}catch(e){
    $('#app').innerHTML=`<div class="card"><h2>Este link no funciona</h2><p class="sub" style="margin-top:6px">Pídele a la organizadora que te lo vuelva a mandar.</p></div>`;return}
  const g=d.group;
  $('#title').textContent=g.name;
  $('#kicker').textContent='Hola, '+d.me;
  $('#subtitle').textContent=[fecha(g.event_date),g.budget].filter(Boolean).join(' · ');
  const facts=[['Fecha',fecha(g.event_date)],['Hora',g.event_time],['Lugar',g.place],['Monto',g.budget]].filter(x=>x[1]);
  $('#app').innerHTML=`
   <section class="card reveal" id="revCard">${d.to?`
     <p class="sub" id="tapHint">Toca el sobre para ver a quién le regalas.<br>Mejor ábrelo donde nadie vea tu pantalla.</p>
     <div class="envelope" id="env"><div class="body"></div><div class="flap"></div><div class="seal">${esc((g.name||'I')[0])}</div></div>
     <div id="out" class="hide">
       <div class="lbl">Te toca regalarle a</div>
       <div class="who">${esc(d.to.name)}</div>
       ${(d.to.wish||(d.to.links||[]).length)?`<div class="wishbox"><b>Lo que le gustaría</b>${d.to.wish?'\n'+esc(d.to.wish):''}</div>${(d.to.links||[]).length?`<div class="glist">${d.to.links.map((l,i)=>linkCard(l,i,false)).join('')}</div>`:''}`
         :'<div class="wishbox">Todavía no escribe su lista de deseos. Vuelve a abrir este link más adelante para ver si ya la dejó.</div>'}
     </div>`
   :`<h2>Todavía no se hace el sorteo</h2><p class="sub" style="margin-top:6px">Cuando la organizadora sortee, en este mismo link vas a ver a quién le regalas. Mientras, puedes dejar tu lista de deseos.</p>`}
   </section>
   ${facts.length?`<section class="card"><h2 style="margin-bottom:10px">Los detalles</h2><dl class="facts">${facts.map(f=>`<dt>${f[0]}</dt><dd>${esc(f[1])}</dd>`).join('')}</dl></section>`:''}
   ${g.message?`<section class="card"><h2 style="margin-bottom:8px">Indicaciones</h2><p class="msg">${esc(g.message)}</p></section>`:''}
   <section class="card">
     <h2>Tu lista de deseos</h2>
     <p class="sub">La va a ver solo quien te regala. Pon ideas, tallas, colores, lo que te sirva.</p>
     <textarea id="myWish" placeholder="Ej. Una vela aromática, talla M en ropa, me gusta el color verde">${esc(d.wish)}</textarea>
     <div class="lnkhead">Links de regalos <span style="font-weight:400">(si quieres)</span></div>
     <p class="sub" style="margin-bottom:8px">Pega el link de algo que te guste de Amazon, Mercado Libre o cualquier tienda.</p>
     <div id="myLinks" class="glist"></div>
     <div id="addLinkBox" style="margin-top:10px">
       <input id="lnkUrl" type="url" inputmode="url" placeholder="Pega aquí el link" autocomplete="off">
       <input id="lnkNote" placeholder="Nota: talla, color… (opcional)" maxlength="80" style="margin-top:8px">
       <button class="btn quiet" id="lnkAdd">Agregar link de un regalo</button>
     </div>
     <button class="btn main" id="saveWish">Guardar mi lista</button>
     <div class="status" id="wSt"></div>
   </section>`;
  const env=$('#env');
  if(env){
    const open=()=>{env.classList.add('open');$('#tapHint').classList.add('hide');setTimeout(()=>{$('#out').classList.remove('hide');env.classList.add('hide')},550);sessionStorage.setItem('ix_open_'+PTOK,'1')};
    env.onclick=open;
    if(sessionStorage.getItem('ix_open_'+PTOK)){env.classList.add('hide');$('#tapHint').classList.add('hide');$('#out').classList.remove('hide')}
  }
  let L=Array.isArray(d.links)?d.links.slice():[];
  const drawLinks=()=>{
    $('#myLinks').innerHTML=L.map((l,i)=>linkCard(l,i,true)).join('');
    $('#addLinkBox').classList.toggle('hide',L.length>=10);
    document.querySelectorAll('[data-li]').forEach(b=>b.onclick=()=>{L.splice(+b.dataset.li,1);drawLinks();saveAll('Link quitado')});
  };
  async function saveAll(msg){
    const b=$('#saveWish');b.disabled=true;b.textContent='Guardando…';let ok=false;
    try{L=await rpc('ix_set_wish2',{ptok:PTOK,w:$('#myWish').value,links:L});drawLinks();$('#wSt').textContent='Guardada. Puedes cambiarla cuando quieras.';toast(msg||'Tu lista quedó guardada');ok=true}
    catch(e){toast('No se pudo guardar, revisa tu internet')}
    b.disabled=false;b.textContent='Guardar mi lista';return ok;
  }
  $('#lnkAdd').onclick=async()=>{
    const u=findUrl($('#lnkUrl').value);
    if(!u)return toast('Eso no parece un link. Cópialo desde la tienda y pégalo aquí.');
    try{new URL(u)}catch(e){return toast('Eso no parece un link válido')}
    if(L.length>=10)return toast('Puedes poner hasta 10 links');
    L.push({url:u,note:$('#lnkNote').value.trim()});drawLinks();
    if(await saveAll('Link agregado')){$('#lnkUrl').value='';$('#lnkNote').value=''}
  };
  drawLinks();
  $('#saveWish').onclick=()=>saveAll();
}
addEventListener('hashchange',()=>location.reload());
</script>
